<script>
  // Single source of truth: <html>'s `dark` class. Any toggle (button,
  // keyboard, system pref via autoSwitchAppearance) flips this class;
  // MutationObserver pushes the matching giscus theme to the iframe.
  // The `message` listener catches giscus's "ready" event on initial
  // load so light-mode users don't get stuck on a dark initial theme.
  const sync = () => {
    const iframe = document.querySelector('iframe.giscus-frame');
    if (!iframe) return;
    const theme = document.documentElement.classList.contains('dark') ? 'noborder_dark' : 'noborder_light';
    iframe.contentWindow.postMessage({ giscus: { setConfig: { theme } } }, 'https://giscus.app');
  };
  window.addEventListener('message', e => { if (e.origin === 'https://giscus.app') sync(); });
  new MutationObserver(sync).observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
</script>
