
name: Test Yuque API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-yuque:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install httpx

      - name: Debug Yuque script
        env:
          YUQUE_TOKEN: ${{ secrets.YUQUE_TOKEN }}
        run: |
          pwd
          ls -la scripts/
          python -u scripts/test_yuque.py
          echo "Python exit code: $?"
