
name: Test Yuque API

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-yuque:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install httpx

      - name: Test Yuque document access
        env:
          YUQUE_TOKEN: ${{ secrets.YUQUE_TOKEN }}
          YUQUE_BASE_URL: ${{ vars.YUQUE_BASE_URL }}
          YUQUE_GROUP_LOGIN: ${{ vars.YUQUE_GROUP_LOGIN }}
          YUQUE_BOOK_SLUG: ${{ vars.YUQUE_BOOK_SLUG }}
          YUQUE_ROOT_SLUG: ${{ vars.YUQUE_ROOT_SLUG }}
        run: python -u scripts/test_yuque.py
